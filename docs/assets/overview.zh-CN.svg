<title id="title">保留来源，让知识随时可查。</title>
<desc id="desc">原始文档交给 Claude Code 或 Codex 提取、撰写和核对；经审核后存入本地知识库，保留原件、全文、摘要和目录。读取时依次查阅目录、摘要和全文。</desc>
